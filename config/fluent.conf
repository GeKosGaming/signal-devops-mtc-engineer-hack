<system>
  log_level info
  workers 1
</system>
<source>
  @type tail
  @id app_container_logs
  path /var/log/containers/*_signal_nginx-*.log
  pos_file /buffers/containers.pos
  path_key source_file
  tag signal.web
  read_from_head true
  follow_inodes true
  refresh_interval 5s
  rotate_wait 10s
  <parse>
    @type regexp
    expression /^(?<time>\S+) (?<stream>stdout|stderr) (?<flag>[FP]) (?<log>.*)$/
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
    time_type string
  </parse>
</source>
# JSON access logs become searchable fields; text error logs remain in "log".
<filter signal.web>
  @type parser
  key_name log
  reserve_data true
  reserve_time true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>
<filter signal.web>
  @type record_transformer
  enable_ruby true
  <record>
    app web
    namespace signal
    pod ${File.basename(record["source_file"]).split("_").first}
  </record>
  remove_keys source_file,flag
</filter>
<match signal.web>
  @type loki
  @id loki_output
  url http://loki.signal-observe.svc.cluster.local:3100
  line_format json
  extra_labels {"project":"signal"}
  <label>
    app
    namespace
    pod
    stream
  </label>
  <buffer>
    @type file
    path /buffers/loki
    flush_mode interval
    flush_interval 2s
    flush_thread_count 1
    chunk_limit_size 1m
    total_limit_size 256m
    retry_forever true
    retry_max_interval 30s
    overflow_action block
  </buffer>
</match>
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>
